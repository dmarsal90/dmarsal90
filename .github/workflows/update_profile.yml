name: Update profile stats

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update stats
        run: python3 update_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git diff --quiet README.md && exit 0
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "chore: update profile stats" README.md
          git pull --rebase
          git push
